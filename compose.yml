services:
  devops:
    image: "${DEVOPS_IMAGE:-devops:latest}"
    hostname: "devops"
    container_name: "${COMPOSE_PROJECT_NAME}-devops"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./devops
      dockerfile: Dockerfile
    volumes:
      - type: volume
        source: devops_hostkey
        target: /etc/ssh/hostkey
      - type: volume
        source: devops_vscode
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.vscode-server"
      - type: volume
        source: devops_python_uv
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.uv"
      - type: volume
        source: devops_nodejs_nvm
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.nvm/versions/"
      - type: volume
        source: devops_golang_bin
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.g/versions/"
      - type: volume
        source: devops_golang_mod
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.go/pkg/mod"
      - type: volume
        source: devops_rust_rustup
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.rustup"
      - type: volume
        source: devops_rust_cargo
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.cargo/registry"
      - type: volume
        source: devops_ruby_rbenv
        target: "${BUILD_USER_HOME:-/mnt/workspace}/.rbenv/versions"
      - type: volume
        source: devops_playwright_browsers
        target: "/opt/playwright-browsers"


networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
    driver: bridge

volumes:
  devops_hostkey:
  devops_vscode:
  devops_python_uv:
  devops_nodejs_nvm:
  devops_golang_bin:
  devops_golang_mod:
  devops_rust_rustup:
  devops_rust_cargo:
  devops_ruby_rbenv:
  devops_playwright_browsers:
