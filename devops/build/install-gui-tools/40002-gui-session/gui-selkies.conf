[program:gui-selkies]
command = /usr/local/bin/gui-selkies-session.sh
user = agent
autostart = false
autorestart = true
priority = 30
stopasgroup = true
killasgroup = true
environment = XDG_RUNTIME_DIR="/tmp/runtime-agent",WAYLAND_DISPLAY="wayland-0"
stdout_logfile=/var/log/supervisor/gui-selkies/stdout.log
stderr_logfile=/var/log/supervisor/gui-selkies/stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
pidfile=/var/run/gui-selkies.pid
