[program:gui-labwc]
command = /usr/local/bin/gui-labwc-session.sh
user = agent
autostart = false
autorestart = true
priority = 20
stopasgroup = true
killasgroup = true
environment = XDG_RUNTIME_DIR="/tmp/runtime-agent",WAYLAND_DISPLAY="wayland-0",DISPLAY=":0",WLR_BACKENDS="headless",WLR_RENDERER="pixman"
stdout_logfile=/var/log/supervisor/gui-labwc/stdout.log
stderr_logfile=/var/log/supervisor/gui-labwc/stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
pidfile=/var/run/gui-labwc.pid
