name: build-publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devops
  TZ: Asia/Shanghai

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image (latest)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./devops
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Compute date tag
        id: date-tag
        run: echo "value=v$(date +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"

      - name: Build and push china image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./devops
          file: ./devops/Dockerfile.china
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:latest
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.date-tag.outputs.value }}
