name: build-publish-desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/desktop
  TZ: Asia/Shanghai

jobs:
  build-push:
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./desktop
          push: true
          platforms: linux/${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:latest-${{ matrix.platform }}

      - name: Build and push china image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./desktop
          file: ./desktop/Dockerfile.china
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:latest-${{ matrix.platform }}
          push: true
          platforms: linux/${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:china-${{ matrix.platform }}

  merge:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute date tag
        id: date-tag
        run: echo "value=v$(date +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"

      - name: Merge base image into multi-arch latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:latest-amd64 \
            ${{ env.IMAGE }}:latest-arm64

      - name: Merge china image into multi-arch date tag
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.date-tag.outputs.value }} \
            ${{ env.IMAGE }}:china-amd64 \
            ${{ env.IMAGE }}:china-arm64

      - name: Delete intermediate tags
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="desktop"
          # user-scoped or org-scoped packages API endpoint
          SCOPE="user"
          if curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/orgs/$OWNER" >/dev/null 2>&1; then
            SCOPE="orgs/$OWNER"
          fi
          API="https://api.github.com/$SCOPE/packages/container/$PACKAGE/versions"
          for tag in latest-amd64 latest-arm64 china-amd64 china-arm64; do
            echo "== cleanup intermediate tag: $tag =="
            version_id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API?per_page=100" | jq -r --arg t "$tag" \
              '[.[] | select(.name == $t or ((.metadata.container.tags // []) | index($t))) | .id][0]') || true
            if [ -n "$version_id" ] && [ "$version_id" != "null" ]; then
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/$version_id" \
                && echo "  deleted $tag (version $version_id)" \
                || echo "  WARN: failed to delete $tag"
            else
              echo "  $tag not found, skip"
            fi
          done
