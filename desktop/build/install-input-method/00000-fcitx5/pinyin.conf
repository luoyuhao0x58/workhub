# Cloud pinyin sends the composition string to a remote service for extra
# candidates. Off by default: every keystroke of a Chinese input then leaves the
# machine, and the local dictionary is enough for normal typing.
CloudPinyinEnabled=False

# Seven candidates per page. This is fcitx5's own default; pinned so a future
# release changing it does not silently reflow the classic UI popup.
PageSize=7

# Skips the first-run wizard. It is a GUI dialog offering to enable cloud
# pinyin and spell checking, neither of which is reachable from a web session.
FirstRun=False
